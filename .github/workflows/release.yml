name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag version (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_date: ${{ steps.meta.outputs.build_date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version tag: $VERSION" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $nsisDir = "C:\Program Files (x86)\NSIS"
            if (Test-Path $nsisDir) {
              echo $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build Windows zip and NSIS installer
        shell: pwsh
        run: |
          ./scripts/windows/package-windows.ps1 `
            -Version "${{ needs.resolve.outputs.version }}" `
            -Commit "${{ needs.resolve.outputs.commit }}" `
            -BuildDate "${{ needs.resolve.outputs.build_date }}" `
            -FetchWinDivert `
            -FetchGeo

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: error

  build-linux:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch and verify Loyalsoldier Geo DAT files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/geo-cache
          BASE="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download"
          for f in geoip.dat geosite.dat; do
            curl -fsSL "$BASE/$f" -o "dist/geo-cache/$f"
            curl -fsSL "$BASE/$f.sha256sum" -o "dist/geo-cache/$f.sha256sum"
            expected="$(awk '{print tolower($1)}' "dist/geo-cache/$f.sha256sum")"
            actual="$(sha256sum "dist/geo-cache/$f" | awk '{print tolower($1)}')"
            if [ "$expected" != "$actual" ]; then
              echo "Geo SHA-256 mismatch for $f: got $actual, expected $expected" >&2
              exit 1
            fi
          done

      - name: Build Linux tar.gz and deb packages (amd64 & arm64)
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.commit }}
          BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          LDFLAGS="-s -w -X proxy.local/m0/internal/buildinfo.Version=${VERSION} -X proxy.local/m0/internal/buildinfo.Commit=${COMMIT} -X proxy.local/m0/internal/buildinfo.BuildDate=${BUILD_DATE}"
          chmod +x scripts/linux/package-deb.sh

          for ARCH in amd64 arm64; do
            OUT_DIR="dist/linux-${ARCH}"
            mkdir -p "${OUT_DIR}/data"
            CGO_ENABLED=0 GOOS=linux GOARCH="${ARCH}" go build -trimpath -ldflags "${LDFLAGS}" -o "${OUT_DIR}/proxy" ./cmd/proxy
            cp dist/geo-cache/geoip.dat dist/geo-cache/geosite.dat "${OUT_DIR}/data/"
            tar -C "${OUT_DIR}" -czf "dist/release/proxy-linux-${ARCH}.tar.gz" proxy data/geoip.dat data/geosite.dat
            ./scripts/linux/package-deb.sh "${VERSION}" "${ARCH}" "${OUT_DIR}/proxy" dist/geo-cache dist/release
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [resolve, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect artifacts and generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp downloaded-artifacts/release-windows/* release-assets/
          cp downloaded-artifacts/release-linux/* release-assets/
          go run ./cmd/release-manifest \
            --dir release-assets \
            --version "${{ needs.resolve.outputs.version }}"
          ls -la release-assets
          cat release-assets/checksums.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--title "Proxy ${VERSION}" --generate-notes)
          if [ "${PRERELEASE}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" release-assets/* --clobber
          else
            gh release create "${VERSION}" release-assets/* "${FLAGS[@]}"
          fi
