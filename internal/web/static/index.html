<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>透明代理控制台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 小屏幕侧边栏遮罩层 -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

  <!-- 左侧固定/抽屉式侧边栏 -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span>透明代理控制台</span>
    </div>

    <nav class="sidebar-nav">
      <button id="nav-overview" class="nav-item active" onclick="switchTab('overview')">
        总览
      </button>
      <button id="nav-logs" class="nav-item" onclick="switchTab('logs')">
        日志
      </button>
    </nav>

    <!-- 外观设置 -->
    <div class="sidebar-footer">
      <div class="theme-label">外观设置</div>
      <div class="theme-toggle-group">
        <button id="btn-theme-light" class="theme-btn" onclick="setTheme('light')">浅色</button>
        <button id="btn-theme-dark" class="theme-btn" onclick="setTheme('dark')">深色</button>
        <button id="btn-theme-auto" class="theme-btn" onclick="setTheme('auto')">跟随</button>
      </div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-wrapper">
    <!-- 顶部操作栏 -->
    <header class="top-header">
      <div class="top-header-left">
        <button class="menu-toggle-btn" onclick="toggleSidebar()" title="折叠/展开侧边栏">
          ☰
        </button>
        <div id="page-title" class="page-title">系统总览</div>
      </div>

      <div class="top-header-actions">
        <button class="action-btn" onclick="fetchOverviewData()" title="刷新数据">
          刷新数据
        </button>
        <button class="action-btn" onclick="flushDNS()" title="清空 DNS 缓存">
          清空DNS
        </button>
        <button class="action-btn" onclick="reloadConfig()" title="重新加载配置文件">
          重载配置
        </button>
      </div>
    </header>

    <!-- 视图内容区 -->
    <div class="content-area">

      <!-- 视图 1：总览 -->
      <section id="view-overview">
        <!-- 顶部指标卡片 -->
        <div class="overview-grid">
          <div class="metric-card">
            <div class="metric-label">实际驱动</div>
            <div id="metric-driver" class="metric-value"><span class="skeleton skeleton-lg"></span></div>
            <div id="metric-scope" class="metric-sub"><span class="skeleton skeleton-sm"></span></div>
          </div>
          <div class="metric-card">
            <div class="metric-label">当前 TCP 连接</div>
            <div id="metric-tcp" class="metric-value"><span class="skeleton skeleton-lg"></span></div>
            <div id="metric-tcp-sub" class="metric-sub"><span class="skeleton skeleton-sm"></span></div>
          </div>
          <div class="metric-card">
            <div class="metric-label">UDP 传输统计</div>
            <div id="metric-udp-sessions" class="metric-value"><span class="skeleton skeleton-lg"></span></div>
            <div id="metric-udp-drops" class="metric-sub"><span class="skeleton skeleton-sm"></span></div>
          </div>
          <div class="metric-card">
            <div class="metric-label">DNS 缓存记录</div>
            <div id="metric-dns-cached" class="metric-value"><span class="skeleton skeleton-lg"></span></div>
            <div id="metric-dns-sub" class="metric-sub"><span class="skeleton skeleton-sm"></span></div>
          </div>
        </div>

        <!-- 详细数据模块 (4个大小一致的标准区块) -->
        <div class="dashboard-grid">
          <!-- 区块 1：出站分流统计 -->
          <div class="section-box">
            <div class="section-title">出站分流统计</div>
            <div id="outbound-list" class="section-content-scroll">
              <div class="skeleton skeleton-row"></div>
              <div class="skeleton skeleton-row skeleton-w80"></div>
              <div class="skeleton skeleton-row skeleton-w65"></div>
              <div class="skeleton skeleton-row skeleton-w75"></div>
            </div>
            <div id="outbound-footer" class="section-footer">
              <span class="skeleton skeleton-sm"></span>
              <span class="skeleton skeleton-sm"></span>
            </div>
          </div>

          <!-- 区块 2：活跃连接列表 -->
          <div class="section-box">
            <div class="section-title">活跃连接列表</div>
            <div class="table-scroll-container">
              <table class="data-table">
                <thead>
                  <tr>
                    <th class="col-id">编号</th>
                    <th class="col-addr">源地址</th>
                    <th class="col-addr">目标地址</th>
                    <th class="col-outbound">出站</th>
                    <th class="col-duration">持续时间</th>
                  </tr>
                </thead>
                <tbody id="active-conns-body">
                  <tr><td colspan="5"><div class="skeleton skeleton-row"></div></td></tr>
                  <tr><td colspan="5"><div class="skeleton skeleton-row skeleton-w80"></div></td></tr>
                  <tr><td colspan="5"><div class="skeleton skeleton-row skeleton-w75"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- 区块 3：DNS 上游分流统计 -->
          <div class="section-box">
            <div class="section-title">DNS 上游分流统计</div>
            <div id="dns-upstream-list" class="section-content-scroll">
              <div class="skeleton skeleton-row"></div>
              <div class="skeleton skeleton-row skeleton-w80"></div>
              <div class="skeleton skeleton-row skeleton-w65"></div>
              <div class="skeleton skeleton-row skeleton-w75"></div>
            </div>
            <div id="dns-upstream-footer" class="section-footer">
              <span class="skeleton skeleton-sm"></span>
              <span class="skeleton skeleton-sm"></span>
            </div>
          </div>

          <!-- 区块 4：DNS 查询分布统计 -->
          <div class="section-box">
            <div class="section-title">DNS 查询分布统计</div>
            <div class="pie-wrapper">
              <div class="pie-canvas-box">
                <div id="dns-pie-skeleton" class="skeleton skeleton-ring"></div>
                <canvas id="dns-pie-canvas" class="hidden" width="180" height="180"></canvas>
              </div>
              <div class="pie-legend" id="dns-pie-legend">
                <div class="skeleton skeleton-row"></div>
                <div class="skeleton skeleton-row skeleton-w80"></div>
                <div class="skeleton skeleton-row skeleton-w75"></div>
                <div class="skeleton skeleton-row skeleton-w65"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 视图 2：日志 -->
      <section id="view-logs" class="logs-view hidden">
        <div class="logs-toolbar">
          <div class="logs-filters">
            <input type="text" id="log-search" class="log-search-input" placeholder="按关键词过滤日志..." oninput="filterLogs()">
            <select id="log-level-filter" class="log-select" onchange="filterLogs()" title="按级别筛选已加载日志">
              <option value="all">显示：全部级别</option>
              <option value="debug">显示：调试及以上</option>
              <option value="info">显示：信息及以上</option>
              <option value="warn">显示：警告及以上</option>
              <option value="error">显示：仅错误</option>
            </select>
          </div>
          <div class="logs-controls">
            <div class="log-level-control">
              <span class="log-level-caption">运行级别</span>
              <select id="log-runtime-level" class="log-select" onchange="changeRuntimeLogLevel(this.value)" title="临时切换后端日志输出级别（仅当前运行期生效）">
                <option value="debug">调试 (debug)</option>
                <option value="info">信息 (info)</option>
                <option value="warn">警告 (warn)</option>
                <option value="error">错误 (error)</option>
              </select>
              <button id="btn-reset-log-level" class="action-btn hidden" onclick="resetRuntimeLogLevel()" title="恢复配置文件中的默认日志级别">恢复默认</button>
            </div>
            <label class="checkbox-label">
              <input type="checkbox" id="auto-scroll-toggle" checked onchange="toggleAutoScroll(this.checked)">
              <span>自动滚动</span>
            </label>
            <button class="action-btn" id="btn-pause-stream" onclick="toggleStream()">暂停</button>
            <button class="action-btn" onclick="clearLogs()">清屏</button>
            <button class="action-btn" onclick="exportLogs()">导出</button>
          </div>
        </div>

        <div class="terminal-box">
          <div id="log-terminal" class="terminal-content"></div>
        </div>
      </section>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
